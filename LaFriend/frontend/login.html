<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — LaFriend</title>
  
  <!-- Google Fonts: Plus Jakarta Sans (Konsisten dengan index.html) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    /* ==============================================================
       LOGIN SCREEN STYLING (KONSISTEN DENGAN INDEX.HTML)
       ============================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #CBD5E1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 0;
      -webkit-font-smoothing: antialiased;
    }

    /* Frame Mockup Smartphone (Identik dengan index.html) */
    .app-viewport {
      width: 100%;
      max-width: 360px;
      height: 720px;
      background-color: #FFFFFF;
      border-radius: 38px;
      border: 8px solid #1E1B4B;
      box-shadow: 0 25px 60px -15px rgba(30, 27, 75, 0.35);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @media (max-width: 400px) {
      body {
        padding: 0;
      }
      .app-viewport {
        border-radius: 0;
        border: none;
        height: 100vh;
        max-width: 100%;
      }
    }

    .login-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: #FFFFFF;
    }

    /* BAGIAN ATAS: Header Ungu dengan Lengkungan Asimetris Khas LaFriend */
    .login-header-wrapper {
      width: 100%;
      height: 220px;
      background: linear-gradient(145deg, #8B5CF6 0%, #7C3AED 55%, #6D28D9 100%);
      border-bottom-right-radius: 54px;
      padding: 20px 20px 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 8px 24px -4px rgba(124, 58, 237, 0.3);
    }

    /* Top bar: Tombol Back ke Landing/Index */
    .nav-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .nav-back-pill {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .nav-back-pill:hover {
      background: rgba(255, 255, 255, 0.32);
      color: #FFFFFF;
      transform: translateX(-2px);
    }

    /* Konten Brand di Header */
    .header-brand-center {
      text-align: center;
      padding-bottom: 6px;
    }

    .header-icon-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #FFFFFF;
      color: #7C3AED;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      margin: 0 auto 10px auto;
      box-shadow: 0 8px 18px -3px rgba(0, 0, 0, 0.15);
    }

    .header-brand-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.3px;
      margin: 0 0 2px 0;
    }

    .header-brand-sub {
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.88);
      font-weight: 500;
      margin: 0;
    }

    /* BAGIAN BAWAH: Form Login */
    .login-content-wrapper {
      flex: 1;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 24px 22px 24px;
    }

    .login-heading {
      font-size: 1.35rem;
      font-weight: 800;
      color: #1E1B4B;
      line-height: 1.25;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }

    .login-subheading {
      font-size: 0.82rem;
      color: #64748B;
      line-height: 1.4;
      margin-bottom: 18px;
      font-weight: 500;
    }

    /* Form Fields */
    .form-group-clean {
      margin-bottom: 14px;
    }

    .form-label-clean {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: #1E1B4B;
      margin-bottom: 6px;
      letter-spacing: -0.2px;
    }

    .form-control-clean {
      width: 100%;
      height: 46px;
      padding: 10px 14px;
      font-size: 0.86rem;
      font-family: inherit;
      color: #1E1B4B;
      background-color: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-control-clean:focus {
      background-color: #FFFFFF;
      border-color: #8B5CF6;
      box-shadow: 0 0 0 3.5px rgba(139, 92, 246, 0.15);
    }

    /* Checkbox Ingat Akun */
    .form-check-clean {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .form-check-clean input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #7C3AED;
      cursor: pointer;
    }

    .form-check-clean label {
      font-size: 0.8rem;
      color: #64748B;
      font-weight: 500;
      cursor: pointer;
    }

    /* Tombol Submit Login (Identik dengan tombol index.html) */
    .btn-login-submit {
      background: linear-gradient(135deg, #8B5CF6, #7C3AED);
      color: #FFFFFF;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 13px 20px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      display: block;
      width: 100%;
      box-shadow: 0 8px 20px -4px rgba(124, 58, 237, 0.4);
      transition: all 0.2s ease;
      letter-spacing: -0.2px;
      text-align: center;
    }

    .btn-login-submit:hover {
      background: linear-gradient(135deg, #7C3AED, #6D28D9);
      color: #FFFFFF;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px -2px rgba(124, 58, 237, 0.5);
    }

    .btn-login-submit:active {
      transform: translateY(0);
    }

    .btn-login-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Footer Tautan Daftar */
    .login-footer-link {
      text-align: center;
      padding-top: 8px;
      font-size: 0.8rem;
      color: #64748B;
      font-weight: 500;
    }

    .login-footer-link a {
      color: #7C3AED;
      font-weight: 700;
      text-decoration: none;
      margin-left: 4px;
      transition: all 0.15s ease;
    }

    .login-footer-link a:hover {
      color: #6D28D9;
      text-decoration: underline;
    }

    /* Alert Notifikasi */
    .alert, .alert-custom {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-danger, .alert-custom-danger {
      background-color: #FEF2F2;
      color: #DC2626;
      border: 1px solid #FCA5A5;
    }

    .alert-success, .alert-custom-success {
      background-color: #ECFDF5;
      color: #059669;
      border: 1px solid #6EE7B7;
    }
  </style>
</head>
<body>

  <!-- MOBILE PHONE FRAME (KONSISTEN DENGAN INDEX.HTML) -->
  <div class="app-viewport">
    
    <div class="login-screen">
      
      <!-- BAGIAN ATAS: HEADER PURPLE DENGAN LENGKUNGAN ASIMETRIS KHAS LAFRIEND -->
      <div class="login-header-wrapper">
        
        <div class="nav-top-bar">
          <a href="index.html" class="nav-back-pill" title="Kembali ke Beranda">
            <i class="bi bi-chevron-left"></i>
          </a>
          <span style="font-size: 0.78rem; font-weight: 600; color: rgba(255,255,255,0.75);">Masuk Akun</span>
          <div style="width: 36px;"></div> <!-- Spacer penyeimbang -->
        </div>

        <div class="header-brand-center">
          <div class="header-icon-circle">
            <i class="bi bi-people-fill"></i>
          </div>
          <h2 class="header-brand-title">LaFriend</h2>
          <p class="header-brand-sub">Platform Kolaborasi Belajar Mahasiswa</p>
        </div>

      </div>

      <!-- BAGIAN BAWAH: FORM LOGIN MAHASISWA -->
      <div class="login-content-wrapper">
        
        <div>
          <div class="mb-3">
            <h1 class="login-heading">Selamat Datang</h1>
            <p class="login-subheading">Masuk dengan email kampus Telkom University</p>
          </div>

          <!-- Alert Pesan Error / Sukses -->
          <div id="authAlert"></div>

          <!-- Form Login -->
          <form id="loginForm">
            <div class="form-group-clean">
              <label class="form-label-clean" for="inputEmail">Email Kampus</label>
              <input 
                type="email" 
                id="inputEmail" 
                class="form-control-clean" 
                placeholder="nama@student.telkomuniversity.ac.id" 
                value="andi@student.telkomuniversity.ac.id"
                required
              >
            </div>

            <div class="form-group-clean">
              <label class="form-label-clean" for="inputPassword">Password</label>
              <input 
                type="password" 
                id="inputPassword" 
                class="form-control-clean" 
                placeholder="Masukkan password" 
                value="password123"
                required
              >
            </div>

            <div class="form-check-clean">
              <input type="checkbox" id="rememberMe" checked>
              <label for="rememberMe">Ingat akun saya</label>
            </div>

            <button type="submit" id="btnSubmitLogin" class="btn-login-submit">
              Masuk ke Akun
            </button>
          </form>
        </div>

        <!-- Footer Registrasi -->
        <div class="login-footer-link">
          <span>Belum punya akun?</span>
          <a href="register.html">Daftar sekarang &rarr;</a>
        </div>

      </div>

    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
