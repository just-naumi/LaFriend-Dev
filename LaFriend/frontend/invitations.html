<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Belajar — LaFriend</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css?v=5.0">
  <link rel="stylesheet" href="css/sessions.css?v=1.0">
  <link rel="stylesheet" href="css/matching.css?v=1.0">
</head>
<body>

  <div class="app-viewport sessions-viewport" id="invitationsPageRoot">

    <!-- HEADER -->
    <header class="sessions-header">
      <div class="sessions-topbar">
        <div class="sessions-topbar-left">
          <a href="dashboard.html" class="icon-circle-btn" id="btnBackToDashboard" title="Kembali ke Dashboard" aria-label="Kembali ke Dashboard">
            <i class="bi bi-arrow-left"></i>
          </a>
          <div class="sessions-title-wrap">
            <h1 class="sessions-page-title">Undangan Belajar</h1>
            <div class="sessions-page-sub">Respons undangan masuk &amp; pantau undangan terkirim</div>
          </div>
        </div>
        <span class="sessions-count-pill" id="invitationsCountPill">0 item</span>
      </div>

      <div class="sessions-user-strip">
        <div class="sessions-user-identity">
          <div class="sessions-mini-avatar" id="invitationsUserAvatar">M</div>
          <span class="sessions-user-name" id="invitationsUserName">Mahasiswa</span>
        </div>
        <button type="button" class="sessions-refresh-btn" id="btnRefreshInvitations" title="Muat ulang daftar undangan">
          <i class="bi bi-arrow-clockwise"></i>
          <span>Segarkan</span>
        </button>
      </div>
    </header>

    <!-- TWO TABS: UNDANGAN MASUK & UNDANGAN TERKIRIM -->
    <div class="la-tabs-bar" id="invitationsTabBar" role="tablist">
      <button type="button" class="la-tab-btn active" id="tabInbox" data-tab="inbox" role="tab" aria-selected="true">
        <i class="bi bi-inbox-fill"></i>
        <span>Undangan Masuk</span>
      </button>
      <button type="button" class="la-tab-btn" id="tabSent" data-tab="sent" role="tab" aria-selected="false">
        <i class="bi bi-send-fill"></i>
        <span>Undangan Terkirim</span>
      </button>
    </div>

    <!-- FILTER STATUS LOKAL (UNTUK TAB UNDANGAN MASUK) -->
    <nav class="status-filter-bar" id="invitationStatusFilterBar" aria-label="Filter status undangan">
      <button type="button" class="filter-pill-btn active" data-status="">Semua</button>
      <button type="button" class="filter-pill-btn" data-status="PENDING">Menunggu</button>
      <button type="button" class="filter-pill-btn" data-status="ACCEPTED">Diterima</button>
      <button type="button" class="filter-pill-btn" data-status="REJECTED">Ditolak</button>
      <button type="button" class="filter-pill-btn" data-status="WITHDRAWN">Ditarik</button>
      <button type="button" class="filter-pill-btn" data-status="EXPIRED">Kedaluwarsa</button>
    </nav>

    <!-- KONTEN UTAMA -->
    <main class="sessions-body">
      <div id="invitationsAlertContainer" class="d-none" role="alert" aria-live="polite"></div>
      <div id="invitationsListContainer" aria-live="polite"></div>
    </main>

    <!-- MODAL KONFIRMASI IN-FRAME -->
    <div id="confirmActionModal" class="confirm-modal-backdrop d-none" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
      <div class="confirm-modal-card">
        <h2 class="confirm-modal-title" id="confirmModalTitle">Konfirmasi Tindakan</h2>
        <p class="confirm-modal-message" id="confirmModalMessage"></p>
        <div id="confirmModalReasonWrap" class="confirm-reason-wrap d-none">
          <textarea id="confirmModalReasonInput" class="la-textarea" rows="2" placeholder="Alasan penolakan (opsional)..."></textarea>
        </div>
        <div class="confirm-modal-actions">
          <button type="button" class="btn-la btn-la--secondary btn-la--sm" id="btnConfirmCancel">Batal</button>
          <button type="button" class="btn-la btn-la--primary btn-la--sm" id="btnConfirmProceed">Lanjutkan</button>
        </div>
      </div>
    </div>

  </div>

  <script src="js/app.js?v=5.0"></script>
  <script src="js/invitations.js?v=1.0"></script>
</body>
</html>
