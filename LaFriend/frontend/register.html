<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Mahasiswa — LaFriend</title>
  <!-- Bootstrap 5.3 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css?v=5.2">
  <style>
    .reg-ws-box {
      border-top: 1px solid #EEF2F6;
      margin-top: 14px;
      padding-top: 14px;
    }
    .reg-ws-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .reg-ws-chip {
      border: 1.5px solid #E2E8F0;
      background: #FFFFFF;
      color: #475569;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .reg-ws-chip.active {
      border-color: #7C3AED;
      background: #7C3AED;
      color: #FFFFFF;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <!-- PURPLE GRADIENT HEADER -->
    <header class="purple-header">
      <div class="nav-top-bar">
        <a href="login.html" class="icon-circle-btn" title="Kembali ke Login">
          <i class="bi bi-chevron-left"></i>
        </a>
        <div class="top-bar-title">Registrasi Akun</div>
        <div class="icon-circle-btn" style="opacity: 0;"></div>
      </div>

      <div class="text-center py-2">
        <h3 class="hero-tagline mb-1">Daftar Mahasiswa Baru</h3>
        <p class="hero-subtitle mb-0">Atur profil &amp; waktu luang belajarmu sekali saja</p>
      </div>
    </header>

    <!-- WHITE SHEET CONTENT CONTAINER -->
    <main class="white-sheet-container">
      
      <!-- Alert -->
      <div id="authAlert"></div>

      <!-- Register Form -->
      <form id="registerForm">
        
        <div class="form-group-clean">
          <label class="form-label-clean" for="regName">Nama Lengkap</label>
          <input type="text" id="regName" class="form-control-clean" placeholder="Contoh: Muhammad Farhan" required>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-7">
            <label class="form-label-clean" for="regNim">NIM</label>
            <input type="text" id="regNim" class="form-control-clean" placeholder="1201250088" required>
          </div>
          <div class="col-5">
            <label class="form-label-clean" for="regYear">Angkatan</label>
            <input type="number" id="regYear" class="form-control-clean" value="2025" required>
          </div>
        </div>

        <div class="form-group-clean">
          <label class="form-label-clean" for="regProdi">Program Studi</label>
          <select id="regProdi" class="form-select-clean">
            <option value="S1 Teknik Komputer" selected>S1 Teknik Komputer</option>
            <option value="S1 Informatika">S1 Informatika</option>
            <option value="S1 Sistem Informasi">S1 Sistem Informasi</option>
          </select>
        </div>

        <div class="form-group-clean">
          <label class="form-label-clean" for="regEmail">Email Kampus</label>
          <input type="email" id="regEmail" class="form-control-clean" placeholder="nama@student.telkomuniversity.ac.id" required>
        </div>

        <div class="form-group-clean">
          <label class="form-label-clean" for="regPassword">Password</label>
          <input type="password" id="regPassword" class="form-control-clean" placeholder="Minimal 6 karakter" minlength="6" required>
        </div>

        <!-- PENGATURAN WAKTU LUANG MINGGUAN (DIATUR SEKALI SAAT DAFTAR) -->
        <div class="reg-ws-box" id="registerWeeklyScheduleBox">
          <label class="form-label-clean mb-1">
            <i class="bi bi-clock-history text-primary me-1"></i> Waktu Luang Belajarmu (Mingguan)
          </label>
          <p class="small text-muted mb-2" style="font-size:0.73rem;">
            Dipakai otomatis saat kamu membuat rencana belajar — bisa diubah kapan saja dari Dashboard.
          </p>

          <div class="small fw-semibold text-secondary mb-1" style="font-size:0.72rem;">Hari biasanya luang:</div>
          <div class="reg-ws-chips" id="regWsDaysGroup">
            <button type="button" class="reg-ws-chip active" data-day="Senin">Sen</button>
            <button type="button" class="reg-ws-chip" data-day="Selasa">Sel</button>
            <button type="button" class="reg-ws-chip active" data-day="Rabu">Rab</button>
            <button type="button" class="reg-ws-chip active" data-day="Kamis">Kam</button>
            <button type="button" class="reg-ws-chip active" data-day="Jumat">Jum</button>
            <button type="button" class="reg-ws-chip" data-day="Sabtu">Sab</button>
            <button type="button" class="reg-ws-chip" data-day="Minggu">Min</button>
          </div>

          <div class="small fw-semibold text-secondary mb-1" style="font-size:0.72rem;">Jam biasanya luang:</div>
          <div class="reg-ws-chips" id="regWsBlocksGroup">
            <button type="button" class="reg-ws-chip" data-block="pagi">Pagi (08:00–12:00)</button>
            <button type="button" class="reg-ws-chip active" data-block="siang">Siang (13:00–17:00)</button>
            <button type="button" class="reg-ws-chip" data-block="malam">Malam (18:30–21:00)</button>
          </div>
        </div>

        <div class="mt-4 pt-1">
          <button type="submit" id="btnSubmitRegister" class="btn-purple-primary">
            Daftarkan Akun
          </button>
        </div>

      </form>

      <!-- Bottom switch to login -->
      <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--border) !important;">
        <span class="small text-muted">Sudah punya akun?</span>
        <a href="login.html" class="small fw-bold text-decoration-none ms-1" style="color: var(--primary);">
          Masuk di sini &rarr;
        </a>
      </div>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js?v=5.2"></script>
</body>
</html>
