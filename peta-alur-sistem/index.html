<!doctype html>
<html lang="id">
<head>

<title>LaFriend: alur sistem dan hitungan</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2330;--muted:#5d6675;--line:#d9dde4;--accent:#2f6fd6;--accent-soft:#e3ecfb;--out:#1f8a5b;--out-soft:#ddf3e8;--in:#b9770e;--in-soft:#fbefd9;--res:#6a4cc2;--res-soft:#ece6fa}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--panel:#1d2129;--ink:#e6e9ef;--muted:#9aa3b2;--line:#323846;--accent:#6ea0f0;--accent-soft:#22324d;--out:#4cc38a;--out-soft:#173528;--in:#e0a64a;--in-soft:#3a2d16;--res:#a68cf0;--res-soft:#2c2442}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:1200px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:24px 0 8px}
.muted{color:var(--muted)}
main{max-width:1200px;margin:0 auto;padding:0 16px 40px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;text-align:left}
.tab[aria-selected=true]{border-color:var(--accent);background:var(--accent-soft)}
.pre{white-space:pre-line}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:16px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.box{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.box b{display:block;margin-bottom:2px}
.box small{color:var(--muted);display:block}
.box.hasil{border-style:dashed;border-color:var(--res)}
.box.pilih{outline:2px solid var(--accent);background:var(--accent-soft)}
.box.keluar{border-color:var(--out);background:var(--out-soft)}
.box.masuk{border-color:var(--in);background:var(--in-soft)}
.box.redup{opacity:.45}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin:8px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:2px 10px;font:inherit;font-size:13px;cursor:pointer}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer;margin-top:8px}
.card{border-left:3px solid var(--line);padding:6px 0 6px 10px;margin:10px 0}
.card.Keputusan{border-color:var(--accent)}.card.Hitungan{border-color:var(--out)}.card.Hasil{border-color:var(--res)}.card.Cabang{border-color:var(--in);margin-left:14px}.card.Parameter{border-color:var(--ink)}
.card.sorot{background:var(--accent-soft)}
.card h4{margin:0 0 4px;font-size:14px}
.card p{margin:0;font-size:14px}
.list li{margin:6px 0}
.flow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0}
.flow ol{margin:6px 0;padding-left:20px}
a.lnk{color:var(--accent);cursor:pointer;text-decoration:underline}
button:focus-visible,.box:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

</header>
<main>

<div class="layout">
<div><div class="grid" id="grid"></div>

<script>
const D = {"project": {"name": "LaFriend: alur sistem dan hitungan (mengikuti repo)", "summary": "Peta cara sistem LaFriend berpikir menurut dokumen Plan di repo LaFriend-Dev. Tiap fitur dipecah menjadi parameter masuk, pohon keputusan, dan hitungan matematikanya. Belum ada kode."}, "nodes": [{"id": "f1", "label": "Fitur 1: Intent-Based Matching", "kind": "feature", "summary": "Sepuluh parameter masuk, dua hasil keluar. Buka satu kotak parameter untuk melihat pohon keputusannya.", "details": "Cara baca: tiap kotak berhuruf adalah satu parameter. Klik kotak untuk melihat penjelasannya dan ke mana ia tersambung. Klik dua kali untuk membuka pohon keputusannya.\n\nA sampai F adalah syarat wajib (H): gagal satu berarti ditolak. E dan G sampai J memberi nilai.\n\nRumus: CS = 0,30 x T + 0,25 x G + 0,15 x S + 0,15 x D + 0,15 x M.\nContoh Andi dengan Budi: 85.\n\nUrutan: sesi yang sudah ada dicari lebih dulu, partner dicari bila tidak ada sesi yang lolos.\n\nSumber: Plan/Day3, Day4, Day5.", "paths": ["fitur-1-intent-matching/**"]}, {"id": "f2", "label": "Fitur 2: Feasibility-Aware Group Formation", "kind": "feature", "summary": "Enam parameter masuk, satu hasil keluar. Buka satu kotak parameter untuk melihat pohon keputusannya.", "details": "Cara baca: tiap kotak berhuruf adalah satu parameter. Klik untuk penjelasan, klik dua kali untuk pohon keputusannya.\n\nCalon ditambahkan satu per satu: cek ukuran, cek jadwal semua anggota, hitung GQ, pilih calon dengan GQ terbaik.\n\nRumus:\nMinGroup = max(min tiap anggota), MaxGroup = min(max tiap anggota, 4)\nGQ = 0,70 x rata-rata pasangan + 0,30 x pasangan terendah\nContoh: 80,83.\n\nUndangan dan persetujuan jadwal masing-masing diberi batas 24 jam.\n\nSumber: Plan/Day7, Day5, Day10.", "paths": ["fitur-2-group-formation/**"]}, {"id": "f3", "label": "Fitur 3: Outcome-Oriented Matching", "kind": "feature", "summary": "Lima parameter masuk, satu hasil keluar. Buka satu kotak parameter untuk melihat hitungannya.", "details": "Cara baca: tiap kotak berhuruf adalah satu parameter. Klik untuk penjelasan, klik dua kali untuk pohon dan hitungannya.\n\nLima metrik: RAR, GFR, SCR, MSS, RSI. Kelimanya tidak digabung menjadi satu skor.\n\nBobot tidak berubah otomatis. Bobot baru harus diuji pada data terpisah dan ditetapkan manual. Angka contoh adalah simulasi, belum ada data.\n\nSumber: Plan/Day9.", "paths": ["fitur-3-outcome/**"]}, {"id": "f1.a", "parent": "f1", "label": "A. Mata kuliah", "kind": "data", "summary": "Satu mata kuliah dari katalog. Wajib.", "details": "Contoh: Struktur Data.\nLanjut ke: Keputusan 1.\nHitungan: tidak ada. Hanya ya atau tidak.\n\nSumber: Plan/Day3.MD bagian 3, Plan/Day4.MD bagian 2.\n\nDi dalam kotak ini: 1 keputusan. Klik dua kali untuk membukanya.", "paths": ["fitur-1-intent-matching/a-mata-kuliah/**"]}, {"id": "f1.b", "parent": "f1", "label": "B. Status akun", "kind": "data", "summary": "Diperiksa sistem, bukan diisi: verification_status dan account_status.", "details": "Contoh: VERIFIED dan ACTIVE.\nLanjut ke: Keputusan 2.\n\nSumber: Plan/Day3.MD bagian 3, Plan/Day4.MD bagian 2.\n\nDi dalam kotak ini: 1 keputusan. Klik dua kali untuk membukanya.", "paths": ["fitur-1-intent-matching/b-status-akun/**"]}, {"id": "f1.c", "parent": "f1", "label": "C. Rentang tanggal", "kind": "data", "summary": "Tanggal paling awal dan paling akhir mahasiswa bersedia belajar (earliest_date, latest_date). Wajib.", "details": "Contoh: 12 sampai 18 November 2026.\nLanjut ke: Keputusan 3.\n\nSumber: Plan/Day3.MD bagian 3, Plan/Day4.MD bagian 2.\n\nDi dalam kotak ini: 1 keputusan. Klik dua kali untuk membukanya.", "paths": ["fitur-1-intent-matching/c-rentang-tanggal/**"]}, {"id": "f1.d", "parent": "f1", "label": "D. Jam kosong", "kind": "data", "summary": "Beberapa pilihan hari dan jam, disimpan di tabel intent_availabilities. Wajib.", "details": "Contoh: Senin 13.00-16.00, Rabu 09.00-12.00, Jumat 13.00-17.00.\nLanjut ke: hitungan irisan jam.\n\nSumber: Plan/Day3.MD bagian 2C, Plan/Day4.MD bagian 2, Plan/Day5.MD bagian 6.\n\nDi dalam kotak ini: 1 keputusan, 1 hitungan. Klik dua kali untuk membukanya.", "paths": ["fitur-1-intent-matching/d-jam-kosong/**"]}, {"id": "f1.e", "parent": "f1", "label": "E. Metode belajar", "kind": "data", "summary": "Offline, Online, atau Hybrid. Boleh lebih dari satu: satu pilihan utama dan pilihan alternatif. Wajib.", "details": "Contoh: Andi Offline (utama), Online (alternatif).\nLanjut ke: Keputusan 5 (boleh atau tidak) dan pohon nilai M (berapa nilainya).\n\nSumber: Plan/Day3.MD bagian 2E, Plan/Day4.MD bagian 8.\n\nDi dalam kotak ini: 2 keputusan, 4 cabang, 1 hitungan. Klik dua kali untuk membukanya.", "paths": ["fitur-1-intent-matching/e-metode/**"]}, {"id": "f1.f", "parent": "f1", "label": "F. Kapasitas sesi", "kind": "data", "summary": "Data milik sesi yang sudah ada, bukan isian mahasiswa: jumlah anggota dan batas anggota.", "details": "Contoh: Session A 2/4, Session C 4/4.\nLanjut ke: Keputusan 6. Hanya dipakai saat calonnya sesi, bukan partner.\n\nSumber: Plan/Day3.MD bagian 3, Plan/Day5.MD bagian 3.\n\nDi dalam kotak ini: 1 keputusan. Klik dua kali untuk membukanya.", "paths": ["fitur-1-intent-matching/f-kapasitas/**"]}, {"id": "f1.g", "parent": "f1", "label": "G. Materi", "kind": "data", "summary": "Satu atau beberapa materi spesifik. Wajib.", "details": "Contoh: Andi Binary Tree. Budi Binary Tree dan BST.\nLanjut ke: penyeragaman nama materi.\n\nSumber: Plan/Day3.MD bagian 2A, Plan/Day4.MD bagian 4.\n\nDi dalam kotak ini: 1 hitungan, 1 proses. Klik dua kali untuk membukanya.", "paths": ["fitur-1-intent-matching/g-materi/**"]}, {"id": "f1.h", "parent": "f1", "label": "H. Tujuan belajar", "kind": "data", "summary": "Satu dari lima pilihan: Memahami materi, Mengerjakan latihan soal, Persiapan ujian, Mengerjakan tugas, Diskusi dan berbagi pengetahuan. Wajib.", "details": "Contoh: Memahami materi.\nLanjut ke: pohon nilai G.\n\nSumber: Plan/Day3.MD bagian 2B, Plan/Day4.MD bagian 5.\n\nDi dalam kotak ini: 1 keputusan, 8 cabang, 1 hitungan. Klik dua kali untuk membukanya.", "paths": ["fitur-1-intent-matching/h-tujuan/**"]}, {"id": "f1.i", "parent": "f1", "label": "I. Gaya belajar", "kind": "data", "summary": "Satu dari empat: Discussion, Practice, Teaching, Focus Study. Wajib.", "details": "Contoh: Discussion.\nLanjut ke: pohon nilai S.\n\nSumber: Plan/Day3.MD bagian 2D, Plan/Day4.MD bagian 6.\n\nDi dalam kotak ini: 1 keputusan, 4 cabang, 1 hitungan. Klik dua kali untuk membukanya.", "paths": ["fitur-1-intent-matching/i-gaya-belajar/**"]}, {"id": "f1.j", "parent": "f1", "label": "J. Prioritas waktu", "kind": "data", "summary": "Urutan kesukaan tiap pilihan waktu: 1 paling disukai, 2 pilihan kedua, dan seterusnya. Field baru preference_rank di intent_availabilities.", "details": "Contoh: Andi memilih Rabu 10.00 sebagai pilihan pertama.\nLanjut ke: pohon nilai D.\n\nBeda dengan jam kosong: jam kosong menentukan boleh atau tidak, prioritas waktu hanya menambah nilai. Dengan begitu hal yang sama tidak dihitung dua kali.\n\nSumber: Plan/Day3.MD bagian 4, Plan/Day4.MD bagian 7.\n\nDi dalam kotak ini: 1 keputusan, 5 cabang, 1 hitungan. Klik dua kali untuk membukanya.", "paths": ["fitur-1-intent-matching/j-prioritas-waktu/**"]}, {"id": "f1.gerbang", "parent": "f1", "label": "Hasil: lolos atau ditolak", "kind": "config", "summary": "Tempat enam syarat wajib bertemu. H = 1 berarti lanjut dinilai, H = 0 berarti tidak diberi skor.", "details": "Di dalam kotak ini: 2 hasil. Klik dua kali untuk membukanya.", "paths": ["fitur-1-intent-matching/y-gerbang/**"]}, {"id": "f1.skor", "parent": "f1", "label": "Hasil: skor CS, sesi dulu, lalu partner", "kind": "config", "summary": "Tempat lima kontribusi dijumlah menjadi CS, diurutkan tanpa ambang, lalu dipilih: bergabung ke sesi yang ada atau lanjut mencari partner.", "details": "Di dalam kotak ini: 2 keputusan, 1 hitungan, 2 hasil, 2 proses. Klik dua kali untuk membukanya.", "paths": ["fitur-1-intent-matching/z-skor-akhir/**"]}, {"id": "f2.a", "parent": "f2", "label": "A. Urutan partner dari Fitur 1", "kind": "data", "summary": "Daftar calon beserta CS terhadap host.", "details": "Contoh: Budi 95, Citra 90, Deni 88.\nLanjut ke: host menjadi anggota pertama.\n\nAturan: skor tinggi terhadap host belum berarti cocok dengan anggota lain.\n\nSumber: Plan/Day7.MD bagian 2 dan 6, Plan/Day10.MD.\n\nDi dalam kotak ini: 1 proses. Klik dua kali untuk membukanya.", "paths": ["fitur-2-group-formation/a-urutan-partner/**"]}, {"id": "f2.b", "parent": "f2", "label": "B. Ukuran kelompok", "kind": "data", "summary": "Jumlah paling sedikit dan paling banyak, termasuk host. Asumsi PoC 2 sampai 4.", "details": "Contoh: Andi 2-4, Budi 3-4, Citra 2-3.\nLanjut ke: hitungan rentang ukuran bersama.\n\nSumber: Plan/Day3.MD bagian 2F, Plan/Day7.MD bagian 2 dan 10.\n\nDi dalam kotak ini: 1 keputusan, 1 hitungan, 1 hasil. Klik dua kali untuk membukanya.", "paths": ["fitur-2-group-formation/b-ukuran-kelompok/**"]}, {"id": "f2.c", "parent": "f2", "label": "C. Jam kosong tiap anggota", "kind": "data", "summary": "Slot jam kosong dari intent semua anggota sementara dan calon.", "details": "Contoh: Andi Rabu 09.00-12.00, Budi Rabu 10.00-13.00, Citra Rabu 11.00-14.00.\nLanjut ke: hitungan irisan seluruh anggota.\n\nSumber: Plan/Day7.MD bagian 5, Plan/Day5.MD bagian 6.\n\nDi dalam kotak ini: 1 keputusan, 1 hitungan. Klik dua kali untuk membukanya.", "paths": ["fitur-2-group-formation/c-jam-kosong/**"]}, {"id": "f2.d", "parent": "f2", "label": "D. Skor antaranggota", "kind": "data", "summary": "CS calon dengan setiap anggota yang sudah ada, dihitung dengan rumus Fitur 1.", "details": "Contoh: Andi-Budi 90, Andi-Citra 85, Budi-Citra 75.\nLanjut ke: tabel skor pasangan.\n\nSumber: Plan/Day7.MD bagian 3, 4, 6, dan 10.\n\nDi dalam kotak ini: 1 keputusan, 2 hitungan, 1 proses. Klik dua kali untuk membukanya.", "paths": ["fitur-2-group-formation/d-skor-antaranggota/**"]}, {"id": "f2.e", "parent": "f2", "label": "E. Jawaban undangan", "kind": "data", "summary": "Menerima, menolak, atau tidak menjawab, dari tiap calon. Status undangan: PENDING, ACCEPTED, REJECTED, WITHDRAWN, EXPIRED.", "details": "Contoh: Budi menerima, Citra menolak.\nLanjut ke: keputusan jawaban.\n\nSumber: Plan/Day7.MD bagian 8, Plan/Day5.MD bagian 9, Plan/Day10.MD.\n\nDi dalam kotak ini: 2 keputusan, 4 cabang. Klik dua kali untuk membukanya.", "paths": ["fitur-2-group-formation/e-jawaban-undangan/**"]}, {"id": "f2.f", "parent": "f2", "label": "F. Persetujuan jadwal akhir", "kind": "data", "summary": "Setuju atau tidak dari tiap anggota terhadap jadwal yang diusulkan.", "details": "Contoh: Rabu 11.00-12.00.\nLanjut ke: keputusan persetujuan.\n\nSumber: Plan/Day5.MD bagian 9, Plan/Day7.MD bagian 11, Plan/Day10.MD.\n\nDi dalam kotak ini: 1 keputusan, 1 cabang, 1 hasil, 1 proses. Klik dua kali untuk membukanya.", "paths": ["fitur-2-group-formation/f-persetujuan-jadwal/**"]}, {"id": "f2.proposal", "parent": "f2", "label": "Hasil: proposal kelompok", "kind": "config", "summary": "Tempat sistem memutuskan kelompok cukup besar untuk diusulkan, atau intent tetap aktif karena calon habis.", "details": "Di dalam kotak ini: 2 keputusan, 2 hasil. Klik dua kali untuk membukanya.", "paths": ["fitur-2-group-formation/z-proposal/**"]}, {"id": "f3.a", "parent": "f3", "label": "A. Catatan aktivitas", "kind": "data", "summary": "Dicatat otomatis di tabel matching_events, bukan diisi mahasiswa.", "details": "Jenis: RECOMMENDATION_VIEWED, JOIN_REQUEST_SENT, INVITATION_ACCEPTED, INVITATION_REJECTED, SCHEDULE_APPROVED, SESSION_CONFIRMED, SESSION_COMPLETED, SESSION_CANCELLED.\nLanjut ke: hitungan RAR.\n\nSumber: Plan/Day9.MD bagian 3A dan 6.\n\nDi dalam kotak ini: 1 hitungan. Klik dua kali untuk membukanya.", "paths": ["fitur-3-outcome/a-catatan-aktivitas/**"]}, {"id": "f3.b", "parent": "f3", "label": "B. Hasil pembentukan kelompok", "kind": "data", "summary": "Berhasil dikonfirmasi atau gagal, diambil otomatis dari status sesi dan undangan.", "details": "Lanjut ke: hitungan GFR, dan alasan bila gagal.\n\nSumber: Plan/Day9.MD bagian 2B, 3B, dan 4.\n\nDi dalam kotak ini: 1 keputusan, 8 cabang, 1 hitungan. Klik dua kali untuk membukanya.", "paths": ["fitur-3-outcome/b-hasil-pembentukan/**"]}, {"id": "f3.c", "parent": "f3", "label": "C. Konfirmasi pelaksanaan sesi", "kind": "data", "summary": "Host atau anggota menyatakan sesi benar-benar terlaksana.", "details": "Lanjut ke: keputusan waktu sesi.\n\nSumber: Plan/Day9.MD bagian 3C, 7, dan 9.\n\nDi dalam kotak ini: 3 keputusan, 2 cabang, 1 hitungan, 2 hasil. Klik dua kali untuk membukanya.", "paths": ["fitur-3-outcome/c-pelaksanaan/**"]}, {"id": "f3.d", "parent": "f3", "label": "D. Recommendation Feedback", "kind": "data", "summary": "Diisi saat melihat rekomendasi:\nkesesuaian (Sangat sesuai, Sesuai, Netral, Tidak sesuai)\nkejelasan alasan (Sangat jelas, Jelas, Kurang jelas, Tidak jelas)\nketertarikan (Tertarik, Ragu-ragu, Tidak tertarik)", "details": "Mengukur persepsi terhadap rekomendasi, bukan keberhasilan sesi. Disimpan di relevance_rating dan explanation_rating.\n\nHitungan: Day9 tidak menulis rumusnya.\nLanjut ke: lima metrik.\n\nSumber: Plan/Day9.MD bagian 2A.\n\nDi dalam kotak ini: hanya parameter, tidak ada pohon. Klik dua kali untuk membukanya.", "paths": ["fitur-3-outcome/d-feedback-rekomendasi/**"]}, {"id": "f3.e", "parent": "f3", "label": "E. Session Feedback", "kind": "data", "summary": "Diisi setelah sesi selesai: terlaksana atau tidak, partisipasi anggota, kesesuaian gaya, merasa terbantu, kepuasan 1 sampai 5, ingin belajar bersama lagi.", "details": "Ini feedback terpenting untuk menilai mutu matching.\nLanjut ke: keputusan pengisian.\n\nSumber: Plan/Day9.MD bagian 2C, 3D, 3E, 7, dan 9.\n\nDi dalam kotak ini: 2 keputusan, 1 cabang, 2 hitungan. Klik dua kali untuk membukanya.", "paths": ["fitur-3-outcome/e-feedback-sesi/**"]}, {"id": "f3.bobot", "parent": "f3", "label": "Hasil: lima metrik dan uji bobot", "kind": "config", "summary": "Tempat lima metrik dikumpulkan, lalu tiga  "fitur-2-group-formation/c-jam-kosong/02-h2_irisan.js", "note": "Mulai 11.00, selesai 12.00. Duration 60 menit."}, {"node": "fitur-2-group-formation/c-jam-kosong/03-k2_irisan.js", "note": "60 >= 60. Ya."}, {"node": "fitur-2-group-formation/d-skor-antaranggota/03-h2_gq.js", "note": "Kelompok A 80,83, kelompok B 75,17."}, {"node": "fitur-2-group-formation/d-skor-antaranggota/04-k2_terbaik.js", "note": "Kelompok A dipilih walau Deni lebih tinggi terhadap Andi."}, {"node": "fitur-2-group-formation/z-proposal/04-r2_proposal.js", "note": "Proposal DRAFT dikirim."}, {"node": "fitur-2-group-formation/e-jawaban-undangan/02-k2_jawab.js", "note": "Tiap calon menjawab dalam 24 jam."}, {"node": "fitur-2-group-formation/f-persetujuan-jadwal/03-k2_jadwal_setuju.js", "note": "Semua menyetujui jadwal Rabu 11.00-12.00."}, {"node": "fitur-2-group-formation/f-persetujuan-jadwal/05-r2_confirmed.js", "note": "Sesi CONFIRMED, intent anggota CONVERTED."}]}, {"id": "fitur-3", "title": "Fitur 3: dari sesi ke evaluasi bobot", "description": "Dari konfirmasi pelaksanaan sampai keputusan bobot.", "steps": [{"node": "fitur-3-outcome/c-pelaksanaan/02-k3_lewat.js", "note": "Jadwal sesi sudah lewat."}, {"node": "fitur-3-outcome/c-pelaksanaan/06-k3_held.js", "note": "Host mengonfirmasi sesi terlaksana."}, {"node": "fitur-3-outcome/c-pelaksanaan/07-r3_selesai.js", "note": "Sesi COMPLETED."}, {"node": "fitur-3-outcome/c-pelaksanaan/09-h3_scr.js", "note": "16 / 20 = 80% (simulasi)."}, {"node": "fitur-3-outcome/e-feedback-sesi/05-h3_mss.js", "note": "(5 + 4 + 4) / 3 = 4,33."}, {"node": "fitur-3-outcome/z-uji-bobot/01-r3_metrik.js", "note": "Lima metrik dilihat berdampingan."}, {"node": "fitur-3-outcome/z-uji-bobot/02-k3_data.js", "note": "Bila data cukup, faktor dianalisis."}, {"node": "fitur-3-outcome/z-uji-bobot/04-r3_uji.js", "note": "Bobot baru diuji pada data terpisah."}, {"node": "fitur-3-outcome/z-uji-bobot/05-k3_lebih.js", "note": "Bobot baru dipakai hanya bila lebih baik."}]}], "files": [{"path": "fitur-1-intent-matching/a-mata-kuliah/01-p_course.js", "name": "Parameter: mata kuliah", "desc": "Satu mata kuliah dari katalog. Wajib.\n\nContoh: Struktur Data.\nLanjut ke: Keputusan 1.\nHitungan: tidak ada. Hanya ya atau tidak.\n\nSumber: Plan/Day3.MD bagian 3, Plan/Day4.MD bagian 2.", "to": ["fitur-1-intent-matching/a-mata-kuliah/02-k_course.js"]}, {"path": "fitur-1-intent-matching/a-mata-kuliah/02-k_course.js", "name": "Keputusan 1: mata kuliah sama?", "desc": "Ya: lanjut ke Keputusan 2.\nTidak: ditolak.\n\nContoh: Andi dan Budi sama-sama Struktur Data. Ya.\n\nSumber: Plan/Day3.MD bagian 3, Plan/Day4.MD bagian 2.", "to": ["fitur-1-intent-matching/b-status-akun/02-k_akun.js", "fitur-1-intent-matching/y-gerbang/02-x_tolak.js"]}, {"path": "fitur-1-intent-matching/b-status-akun/01-p_akun.js", "name": "Parameter: status akun", "desc": "Diperiksa sistem, bukan diisi: verification_status dan account_status.\n\nContoh: VERIFIED dan ACTIVE.\nLanjut ke: Keputusan 2.\n\nSumber: Plan/Day3.MD bagian 3, Plan/Day4.MD bagian 2.", "to": ["fitur-1-intent-matching/b-status-akun/02-k_akun.js"]}, {"path": "fitur-1-intent-matching/b-status-akun/02-k_akun.js", "name": "Keputusan 2: akun aktif dan terverifikasi?", "desc": "Ya: lanjut ke Keputusan 3.\nTidak: ditolak.\n\nSumber: Plan/Day3.MD bagian 3, Plan/Day4.MD bagian 2.", "to": ["fitur-1-intent-matching/c-rentang-tanggal/02-k_tanggal.js", "fitur-1-intent-matching/y-gerbang/02-x_tolak.js"]}, {"path": "fitur-1-intent-matching/c-rentang-tanggal/01-p_tanggal.js", "name": "Parameter: rentang tanggal", "desc": "Tanggal paling awal dan paling akhir mahasiswa bersedia belajar (earliest_date, latest_date). Wajib.\n\nContoh: 12 sampai 18 November 2026.\nLanjut ke: Keputusan 3.\n\nSumber: Plan/Day3.MD bagian 3, Plan/Day4.MD bagian 2.", "to": ["fitur-1-intent-matching/c-rentang-tanggal/02-k_tanggal.js"]}, {"path": "fitur-1-intent-matching/c-rentang-tanggal/02-k_tanggal.js", "name": "Keputusan 3: rentang tanggal beririsan?", "desc": "Ya: lanjut ke hitungan irisan jam.\nTidak: ditolak.\n\nContoh: Andi 12-18 November, Budi 20-25 November. Tidak beririsan, ditolak walau materi dan tujuannya sama.\n\nSumber: Plan/Day3.MD bagian 3, Plan/Day4.MD bagian 2.", "to": ["fitur-1-intent-matching/d-jam-kosong/02-h_jam.js", "fitur-1-intent-matching/y-gerbang/02-x_tolak.js"]}, {"path": "fitur-1-intent-matching/d-jam-kosong/01-p_jam.js", "name": "Parameter: jam kosong", "desc": "Beberapa pilihan hari dan jam, disimpan di tabel intent_availabilities. Wajib.\n\nContoh: Senin 13.00-16.00, Rabu 09.00-12.00, Jumat 13.00-17.00.\nLanjut ke: hitungan irisan jam.\n\nSumber: Plan/Day3.MD bagian 2C, Plan/Day4.MD bagian 2, Plan/Day5.MD bagian 6.", "to": ["fitur-1-intent-matching/d-jam-kosong/02-h_jam.js"]}, {"path": "fitur-1-intent-matching/d-jam-kosong/02-h_jam.js", "name": "Hitungan: irisan jam dua pihak", "desc": "Rumus, untuk tiap tanggal secara terpisah:\nmulai bersama = jam mulai yang paling akhir\nselesai bersama = jam selesai yang paling awal\nirisan = selesai bersama - mulai bersama\n\nContoh hitung sendiri: Andi Rabu 09.00-12.00, Budi Rabu 10.00-12.00.\nmulai = 10.00, selesai = 12.00, irisan = 120 menit.\n\nAturan: jadwal Senin tidak boleh dicampur dengan jadwal Rabu.\nLanjut ke: Keputusan 4.\n\nSumber: Plan/Day3.MD bagian 2C, Plan/Day4.MD bagian 2, Plan/Day5.MD bagian 6.", "to": ["fitur-1-intent-matching/d-jam-kosong/03-k_jam.js"]}, {"path": "fitur-1-intent-matching/d-jam-kosong/03-k_jam.js", "name": "Keputusan 4: irisan minimal 60 menit?", "desc": "Ya: lanjut ke Keputusan 5.\nTidak: ditolak.\n\nContoh: 120 >= 60. Ya.\n\nCatatan: Day4 hanya menulis 'ada jam yang beririsan'. Angka 60 menit diambil dari Day5 dan masih asumsi PoC.\n\nSumber: Plan/Day3.MD bagian 2C, Plan/Day4.MD bagian 2, Plan/Day5.MD bagian 6.", "to": ["fitur-1-intent-matching/e-metode/02-k_mode_syarat.js", "fitur-1-intent-matching/y-gerbang/02-x_tolak.js"]}, {"path": "fitur-1-intent-matching/e-metode/01-p_mode.js", "name": "Parameter: metode belajar", "desc": "Offline, Online, atau Hybrid. Boleh lebih dari satu: satu pilihan utama dan pilihan alternatif. Wajib.\n\nContoh: Andi Offline (utama), Online (alternatif).\nLanjut ke: Keputusan 5 (boleh atau tidak) dan pohon nilai M (berapa nilainya).\n\nSumber: Plan/Day3.MD bagian 2E, Plan/Day4.MD bagian 8.", "to": ["fitur-1-intent-matching/e-metode/02-k_mode_syarat.js", "fitur-1-intent-matching/e-metode/03-k_mode.js"]}, {"path": "fitur-1-intent-matching/e-metode/02-k_mode_syarat.js", "name": "Keputusan 5: ada metode yang bisa dipakai bersama?", "desc": "Ya: lanjut ke Keputusan 6.\nTidak: ditolak.\n\nContoh ditolak: Andi hanya Offline, calon hanya Online. Keduanya eksklusif, jadi tidak ada metode bersama.\n\nSumber: Plan/Day3.MD bagian 2E, Plan/Day4.MD bagian 8.", "to": ["fitur-1-intent-matching/f-kapasitas/02-k_kapasitas.js", "fitur-1-intent-matching/y-gerbang/02-x_tolak.js"]}, {"path": "fitur-1-intent-matching/f-kapasitas/01-p_kapasitas.js", "name": "Parameter: kapasitas sesi", "desc": "Data milik sesi yang sudah ada, bukan isian mahasiswa: jumlah anggota dan batas anggota.\n\nContoh: Session A 2/4, Session C 4/4.\nLanjut ke: Keputusan 6. Hanya dipakai saat calonnya sesi, bukan partner.\n\nSumber: Plan/Day3.MD bagian 3, Plan/Day5.MD bagian 3.", "to": ["fitur-1-intent-matching/f-kapasitas/02-k_kapasitas.js"]}, {"path": "fitur-1-intent-matching/f-kapasitas/02-k_kapasitas.js", "name": "Keputusan 6: sesi masih punya tempat?", "desc": "Hanya untuk calon berupa sesi. Untuk calon partner, keputusan ini dilewati.\n\nYa: lolos.\nTidak: ditolak.\n\nContoh: Session A 2/4 lolos. Session C 4/4 gugur karena penuh.\n\nSumber: Plan/Day3.MD bagian 3, Plan/Day5.MD bagian 3.", "to": ["fitur-1-intent-matching/y-gerbang/01-r_lolos.js", "fitur-1-intent-matching/y-gerbang/02-x_tolak.js"]}, {"path": "fitur-1-intent-matching/y-gerbang/01-r_lolos.js", "name": "Hasil: H = 1, lanjut dinilai", "desc": "Semua syarat wajib terpenuhi. Calon masuk ke lima pohon nilai sekaligus: T, G, S, D, M.\n\nSumber: -matching/z-skor-akhir/01-h_total.js"]}, {"path": "fitur-1-intent-matching/h-tujuan/01-p_goal.js", "name": "Parameter: tujuan belajar", "desc": "Satu dari lima pilihan: Memahami materi, Mengerjakan latihan soal, Persiapan ujian, Mengerjakan tugas, Diskusi dan berbagi pengetahuan. Wajib.\n\nContoh: Memahami materi.\nLanjut ke: pohon nilai G.\n\nSumber: Plan/Day3.MD bagian 2B, Plan/Day4.MD bagian 5.", "to": ["fitur-1-intent-matching/h-tujuan/02-k_goal.js"]}, {"path": "fitur-1-intent-matching/h-tujuan/02-k_goal.js", "name": "Keputusan: pasangan tujuan yang mana?", "desc": "Nilai G diambil dari tabel kecocokan tujuan, rentang 0 sampai 100. Tujuan tidak harus sama persis: yang ingin memahami dan yang ingin latihan soal bisa saling membantu.\n\nCatatan: angka tabel masih asumsi desain.\n\nSumber: Plan/Day3.MD bagian 2B, Plan/Day4.MD bagian 5.", "to": ["fitur-1-intent-matching/h-tujuan/03-g_paham_paham.js", "fitur-1-intent-matching/h-tujuan/04-g_paham_latih.js", "fitur-1-intent-matching/h-tujuan/05-g_paham_ujian.js", "fitur-1-intent-matching/h-tujuan/06-g_latih_ujian.js", "fitur-1-intent-matching/h-tujuan/07-g_tugas_paham.js", "fitur-1-intent-matching/h-tujuan/08-g_tugas_tugas.js", "fitur-1-intent-matching/h-tujuan/09-g_tak_kait.js", "fitur-1-intent-matching/h-tujuan/10-g_lain.js"]}, {"path": "fitur-1-intent-matching/h-tujuan/11-h_goal.js", "name": "Hitungan: G, kesesuaian tujuan (bobot 0,25)", "desc": "Rumus: kontribusi = 0,25 x G.\n\nContoh: Andi dan Budi sama-sama Memahami materi. G = 100. 0,25 x 100 = 25.\n\nLanjut ke: skor akhir.\n\nSumber: Plan/Day3.MD bagian 2B, Plan/Day4.MD bagian 5.", "to": ["fitur-1-intent-matching/z-skor-akhir/01-h_total.js"]}, {"path": "fitur-1-intent-matching/h-tujuan/03-g_paham_paham.js", "name": "Cabang: Memahami materi dengan Memahami materi", "desc": "G = 100.\n\nLanjut ke: hitungan kontribusi.\n\nSumber: Plan/Day3.MD bagian 2B, Plan/Day4.MD bagian 5.", "to": ["fitur-1-intent-matching/h-tujuan/11-h_goal.js"]}, {"path": "fitur-1-intent-matc rutan-partner/02-r2_host.js"]}, {"path": "fitur-2-group-formation/a-urutan-partner/02-r2_host.js", "name": "Proses: host menjadi anggota pertama", "desc": "Host adalah pembuat Study Intent pertama. Host bukan yang paling pintar, hanya penginisiasi.\n\nAturan Day10: satu mahasiswa hanya boleh punya satu proses pembentukan kelompok aktif.\nLanjut ke: calon berikutnya dicoba satu per satu, mulai dari pemeriksaan ukuran.\n\nSumber: Plan/Day7.MD bagian 2 dan 6, Plan/Day10.MD.", "to": ["fitur-2-group-formation/b-ukuran-kelompok/02-h2_ukuran.js"]}, {"path": "fitur-2-group-formation/b-ukuran-kelompok/01-p2_size.js", "name": "Parameter: ukuran kelompok tiap anggota", "desc": "Jumlah paling sedikit dan paling banyak, termasuk host. Asumsi PoC 2 sampai 4.\n\nContoh: Andi 2-4, Budi 3-4, Citra 2-3.\nLanjut ke: hitungan rentang ukuran bersama.\n\nSumber: Plan/Day3.MD bagian 2F, Plan/Day7.MD bagian 2 dan 10.", "to": ["fitur-2-group-formation/b-ukuran-kelompok/02-h2_ukuran.js"]}, {"path": "fitur-2-group-formation/b-ukuran-kelompok/02-h2_ukuran.js", "name": "Hitungan: rentang ukuran bersama", "desc": "Rumus:\nMinGroup = nilai minimum terbesar dari semua anggota\nMaxGroup = nilai maksimum terkecil dari semua anggota, paling tinggi 4\n\nContoh: Andi 2-4, Budi 3-4, Citra 2-3.\nMinGroup = 3, MaxGroup = 3.\nKelompok 3 orang diterima semua. Kelompok 4 orang ditolak Citra.\n\nLanjut ke: keputusan ukuran.\n\nSumber: Plan/Day3.MD bagian 2F, Plan/Day7.MD bagian 2 dan 10.", "to": ["fitur-2-group-formation/b-ukuran-kelompok/03-k2_ukuran.js"]}, {"path": "fitur-2-group-formation/b-ukuran-kelompok/03-k2_ukuran.js", "name": "Keputusan: MinGroup <= MaxGroup?", "desc": "Ya: lanjut ke irisan jadwal.\nTidak: calon ini tidak bisa masuk.\n\nAturan: jumlah anggota tidak boleh lebih dari 4, termasuk host.\n\nSumber: Plan/Day3.MD bagian 2F, Plan/Day7.MD bagian 2 dan 10.", "to": ["fitur-2-group-formation/b-ukuran-kelompok/04-x2_gugur.js", "fitur-2-group-formation/c-jam-kosong/02-h2_irisan.js"]}, {"path": "fitur-2-group-formation/b-ukuran-kelompok/04-x2_gugur.js", "name": "Hasil: calon tidak dimasukkan", "desc": "Calon ini dilewati. Calon berikutnya tetap dicoba.\n\nSumber: Plan/Day3.MD bagian 2F, Plan/Day7.MD bagian 2 dan 10.", "to": []}, {"path": "fitur-2-group-formation/c-jam-kosong/01-p2_jam.js", "name": "Parameter: jam kosong tiap anggota", "desc": "Slot jam kosong dari intent semua anggota sementara dan calon.\n\nContoh: Andi Rabu 09.00-12.00, Budi Rabu 10.00-13.00, Citra Rabu 11.00-14.00.\nLanjut ke: hitungan irisan seluruh anggota.\n\nSumber: Plan/Day7.MD bagian 5, Plan/Day5.MD bagian 6.", "to": ["fitur-2-group-formation/c-jam-kosong/02-h2_irisan.js"]}, {"path": "fitur-2-group-formation/c-jam-kosong/02-h2_irisan.js", "name": "Hitungan: irisan jadwal seluruh anggota", "desc": "Rumus, untuk tiap tanggal secara terpisah:\nStartGroup = jam mulai paling akhir dari semua anggota\nEndGroup = jam selesai paling awal dari semua anggota\nDuration = EndGroup - StartGroup\n\nContoh: mulai 11.00, selesai 12.00, Duration = 60 menit. Jadwal kelompok Rabu 11.00-12.00.\n\nLanjut ke: keputusan durasi.\n\nSumber: Plan/Day7.MD bagian 5, Plan/Day5.MD bagian 6.", "to": ["fitur-2-group-formation/c-jam-kosong/03-k2_irisan.js"]}, {"path": "fitur-2-group-formation/c-jam-kosong/03-k2_irisan.js", "name": "Keputusan: Duration >= 60 menit?", "desc": "Ya: lanjut ke skor antaranggota.\nTidak: calon tidak dimasukkan.\n\nContoh: 60 >= 60. Ya. Bila Citra hanya sampai 10.30, tidak ada waktu bersama 60 menit.\n\nAngka 60 menit masih asumsi PoC.\n\nSumber: Plan/Day7.MD bagian 5, Plan/Day5.MD bagian 6.", "to": ["fitur-2-group-formation/b-ukuran-kelompok/04-x2_gugur.js", "fitur-2-group-formation/d-skor-antaranggota/02-h2_pair.js"]}, {"path": "fitur-2-group-formation/d-skor-antaranggota/01-p2_pair.js", "name": "Parameter: skor antaranggota", "desc": "CS calon dengan setiap anggota yang sudah ada, dihitung dengan rumus Fitur 1.\n\nContoh: Andi-Budi 90, Andi-Citra 85, Budi-Citra 75.\nLanjut ke: tabel skor pasangan.\n\nSumber: Plan/Day7.MD bagian 3, 4, 6, dan 10.", "to": ["fitur-2-group-formation/d-skor-antaranggota/02-h2_pair.js"]}, {"path": "fitur-2-group-formation/d-skor-antaranggota/02-h2_pair.js", "name": "Hitungan: tabel skor semua pasangan", "desc": "Semua pasangan anggota dinilai, bukan hanya pasangan dengan host.\n\nRumus: jumlah pasangan = n x (n - 1) / 2. Tiga orang berarti 3 pasangan.\n\nLanjut ke: hitungan GQ.\n\nSumber: Plan/Day7.MD bagian 3, 4, 6, dan 10.", "to": ["fitur-2-group-formation/d-skor-antaranggota/03-h2_gq.js"]}, {"path": "fitur-2-group-formation/d-skor-antaranggota/03-h2_gq.js", "name": "Hitungan: Group Quality Score (GQ)", "desc": "Rumus:\nAPS = rata-rata skor semua pasangan\nMPS = skor pasangan terendah\nGQ = 0,70 x APS + 0,30 x MPS\n\nKelompok A, Andi-Budi-Citra: 90, 85, 75.\nAPS = 83,33, MPS = 75\nGQ = 58,33 + 22,5 = 80,83.\n\nKelompok B, Andi-Budi-Deni: 90, 95, 60.\nAPS = 81,67, MPS = 60\nGQ = 57,17 + 18 = 75,17.\n\nBobot 70:30 masih hipotesis desain.\nLanjut ke: pemilihan calon.\n\nSumber: Plan/Day7.MD bagian 3, 4, 6, dan 10.", "to": ["fitur-2-group-formation/d-skor-antaranggota/04-k2_terbaik.js"]}, {"path": "fitur-2-group-formation/d-skor-antaranggota/04-k2_terbaik.js", "name": "Keputusan: calon mana yang memberi GQ tertinggi?", "desc": "Tiap calon yang lolos diuji bersama kelompok sementara. Yang dipilih adalah calon dengan GQ terbaik, bukan calon dengan skor tertinggi terhadap host.\n\nContoh: Deni 95 terhadap Andi, lebih tinggi dari Citra 85. Tetapi Deni-Budi hanya 60. Kelompok A (80,83) dipilih, bukan B (75,17).\n\nCatatan: cara bertahap ini tidak menjamin kombinasi terbaik dari semua kemungkinan. Cukup untuk PoC.\n\nSumber: Plan/Day7.MD bagian 3, 4, 6, dan 10.", "to": ["fitur-2-group-formation/d-skor-antaranggota/05-r2_tambah.js"]}, {"path": "fitur-2-group-formation/d-skor-antaranggota/05-r2_tambah.js", "name": "Proses: tambahkan calon terbaik ke kelompok", "desc": "Lanjut ke: keputusan jumlah minimum.\n\nSumber: Plan/Day7.MD bagian 3, 4, 6, dan 10.", "to": ["fitur-2-group-formation/z-proposal/01-k2_min.js"]}, {"path": "fitur-2-group-formation/z-proposal/01-k2_min.js", "name": "Keputusan: jumlah anggota sudah mencapai MinGroup?", "desc": "Ya: buat Group Proposal. Sistem boleh berhenti di MinGroup, tidak harus sampai MaxGroup.\nTidak: periksa sisa calon.\n\nSumber: Plan/Day7.MD bagian 6 dan 10, Plan/Day5.MD bagian 10.", "to": ["fitur-2-group-formation/z-proposal/02-k2_sisa.js", "fitur-2-group-formation/z-proposal/04-r2_proposal.js"]}, {"path": "fitur-2-group-formation/z-proposal/02-k2_sisa.js", "name": "Keputusan: masih ada calon yang belum dicoba?", "desc": "Ya: ulangi dari pemeriksaan ukuran untuk calon berikutnya.\nTidak: kelompok belum terbentuk.\n\nSumber: Plan/Day7.MD bagian 6 dan 10, Plan/Day5.MD bagian 10.", "to": ["fitur-2-group-formation/z-proposal/03-x2_habis.js"]}, {"path": "fitur-2-group-formation/z-proposal/03-x2_habis.js", "name": "Hasil: kelompok belum terbentuk, intent tetap ACTIVE", "desc": "Intent tidak dihapus, jadi mahasiswa tidak mengisi ulang. Pencarian berlanjut sampai batas tanggal, lalu intent menjadi EXPIRED.\n\nSumber: Plan/Day7.MD bagian 6 dan 10, Plan/Day5.MD bagian 10.", "to": []}, {"path": "fitur-2-group-formation/z-proposal/04-r2_proposal.js", "name": "Hasil: Group Proposal", "desc": "Disimpan sebagai study_sessions berstatus DRAFT. Isinya: daftar anggota, topik, jadwal bersama, dan alasan kecocokan.\n\nContoh: Andi (host), Budi, Citra, Rabu 11.00-12.00, GQ 80,83.\nLanjut ke: undangan. Intent host menjadi GROUP_FORMING.\n\nSumber: Plan/Day7.MD bagian 6 dan 10, Plan/Day5.MD bagian 10.", "to": ["fitur-2-group-formation/e-jawaban-undangan/02-k2_jawab.js"]}, {"path": "fitur-2-group-formation/e-jawaban-undangan/01-p2_undangan.js", "name": "Parameter: jawaban undangan", "desc": "Menerima, menolak, atau tidak menjawab, dari tiap calon. Status undangan: PENDING, ACCEPTED, REJECTED, WITHDRAWN, EXPIRED.\n\nContoh: Budi menerima, Citra menolak.\nLanjut ke: keputusan jawaban.\n\nSumber: Plan/Day7.MD bagian 8, Plan/Day5.MD bagian 9, Plan/Day10.MD.", "to": ["fitur-2-group-formation/e-jawaban-undangan/02-k2_jawab.js"]}, {"path": "fitur-2-group-formation/e-jawaban-undangan/02-k2_jawab.js", "name": "Keputusan: apa jawaban tiap calon dalam 24 jam?", "desc": "Tiga cabang per calon.\n\nBatas 24 jam masih asumsi PoC dan harus bisa diubah.\n\nSumber: Plan/Day7.MD bagian 8, Plan/Day5.MD bagian 9, Plan/Day10.MD.", "to": ["fitur-2-group-formation/e-jawaban-undangan/03-c2_terima.js", "fitur-2-group-formation/e-jawaban-undangan/04-c2_tolak.js", "fitur-2-group-formation/e-jawaban-undangan/05-c2_diam.js"]}, {"path": "fitur-2-group-formation/e-jawaban-undangan/03-c2_terima.js", "name": "Cabang: menerima (ACCEPTED)", "desc": "Calon tetap di kelompok.\n\nCatatan: menerima undangan belum berarti sesi dikonfirmasi. Jadwal akhir tetap harus disetujui.\nLanjut ke: persetujuan jadwal, setelah semua menjawab.\n\nSumber: Plan/Day7.MD bagian 8, Plan/Day5.MD bagian 9, Plan/Day10.MD.", "to": ["fitur-2-group-formation/f-persetujuan-jadwal/02-r2_pending.js"]}, {"path": "fitur-2-group-formation/e-jawaban-undangan/04-c2_tolak.js", "name": "Cabang: menolak (REJECTED)", "desc": "Calon dikeluarkan dari rancangan kelompok.\n\nLanjut ke: keputusan jumlah minimum tanpa dia.\n\nSumber: Plan/Day7.MD bagian 8, Plan/Day5.MD bagian 9, Plan/Day10.MD.", "to": ["fitur-2-group-formation/e-jawaban-undangan/06-k2_masih_min.js"]}, {"path": "fitur-2-group-formation/e-jawaban-undangan/05-c2_diam.js", "name": "Cabang: tidak menjawab 24 jam (EXPIRED)", "desc": "Diperlakukan sama seperti menolak.\n\nLanjut ke: keputusan jumlah minimum tanpa dia.\n\nSumber: Plan/Day7.MD bagian 8, Plan/Day5.MD bagian 9, Plan/Day10.MD.", "to": ["fitur-2-group-formation/e-jawaban-undangan/06-k2_masih_min.js"]}, {"path": "fitur-2-group-formation/e-jawaban-undangan/06-k2_masih_min.js", "name": "Keputusan: sisa anggota masih >= MinGroup?", "desc": "Ya: lanjut ke persetujuan jadwal.\nTidak: cari pengganti.\n\nContoh: Andi dan Budi tersisa, MinGroup 2. Ya.\n\nSumber: Plan/Day7.MD bagian 8, Plan/Day5.MD bagian 9, Plan/Day10.MD.", "to": ["fitur-2-group-formation/e-jawaban-undangan/07-c2_ganti.js", "fitur-2-group-formation/f-persetujuan-jadwal/02-r2_pending.js"]}, {"path": "fitur-2-group-formation/e-jawaban-undangan/07-c2_ganti.js", "name": "Cabang: cari pengganti", "desc": "Sistem mencari calon pengganti, menghitung ulang GQ, lalu mengirim proposal baru bila kelompok masih layak.\n\nBila tidak ada pengganti: kelompok belum terbentuk.\n\nSumber: Plan/Day7.MD bagian 8, Plan/Day5.MD bagian 9, Plan/Day10.MD.", "to": ["fitur-2-group-formation/z-proposal/03-x2_habis.js"]}, {"path": "fitur-2-group-formation/f-persetujuan-jadwal/01-p2_jadwal.js", "name": "Parameter: persetujuan jadwal akhir", "desc": "Setuju atau tidak dari tiap anggota terhadap jadwal yang diusulkan.\n\nContoh: Rabu 11.00-12.00.\nLanjut ke: keputusan persetujuan.\n\nSumber: Plan/Day5.MD bagian 9, Plan/Day7.MD bagian 11, Plan/Day10.MD.", "to": ["fitur-2-group-formation/f-persetujuan-jadwal/03-k2_jadwal_setuju.js"]}, {"path": "fitur-2-group-formation/f-persetujuan-jadwal/02-r2_pending.js", "name": "Proses: sesi CONFIRMATION_PENDING", "desc": "Semua anggota yang tersisa sudah menerima undangan. Sistem meminta persetujuan jadwal akhir.\n\nLanjut ke: keputusan persetujuan.\n\nSumber: Plan/Day5.MD bagian 9, Plan/Day7.MD bagian 11, Plan/Day10.MD.", "to": ["fitur-2-group-formation/f-persetujuan-jadwal/03-k2_jadwal_setuju.js"]}, {"path": "fitur-2-group-formation/f-persetujuan-jadwal/03-k2_jadwal_setuju.js", "name": "Keputusan: semua anggota menyetujui jadwal dalam 24 jam?", "desc": "Ya: sesi dikonfirmasi.\nTidak: sesi belum dikonfirmasi.\n\nAturan: kelompok tidak pernah dikonfirmasi otomatis.\n\nSumber: Plan/Day5.MD bagian 9, Plan/Day7.MD bagian 11, Plan/Day10.MD.", "to": ["fitur-2-group-formation/f-persetujuan-jadwal/04-c2_jadwal_tolak.js", "fitur-2-group-formation/f-persetujuan-jadwal/05-r2_confirmed.js"]}, {"path": "fitur-2-group-formation/f-persetujuan-jadwal/04-c2_jadwal_tolak.js", "name": "Cabang: tidak semua setuju", "desc": "Sesi belum dikonfirmasi.\n\nBelum diputuskan: langkah berikutnya, misalnya mengusulkan slot lain atau anggota keluar.\n\nSumber: Plan/Day5.MD bagian 9, Plan/Day7.MD bagian 11, Plan/Day10.MD.", "to": []}, {"path": "fitur-2-group-formation/f-persetujuan-jadwal/05-r2_confirmed.js", "name": "Hasil: sesi CONFIRMED", "desc": "Baru di titik ini kelompok dihitung terbentuk. Intent tiap anggota menjadi CONVERTED.\n\nAturan Day10: sesi yang batal tidak otomatis mengaktifkan lagi intent anggotanya.\nLanjut ke: Fitur 3.\n\nSumber: Plan/Day5.MD bagian 9, Plan/Day7.MD bagian 11, Plan/Day10.MD.", "to": ["fitur-3-outcome/c-pelaksanaan/02-k3_lewat.js"]}, {"path": "fitur-3-outcome/a-catatan-aktivitas/01-p3_event.js", "name": "Parameter: catatan aktivitas", "desc": "Dicatat otomatis di tabel matching_events, bukan diisi mahasiswa.\n\nJenis: RECOMMENDATION_VIEWED, JOIN_REQUEST_SENT, INVITATION_ACCEPTED, INVITATION_REJECTED, SCHEDULE_APPROVED, SESSION_CONFIRMED, SESSION_COMPLETED, SESSION_CANCELLED.\nLanjut ke: hitungan RAR.\n\nSumber: Plan/Day9.MD bagian 3A dan 6.", "to": ["fitur-3-outcome/a-catatan-aktivitas/02-h3_rar.js"]}, {"path": "fitur-3-outcome/a-catatan-aktivitas/02-h3_rar.js", "name": "Hitungan: Recommendation Acceptance Rate (RAR)", "desc": "Rumus: RAR = rekomendasi yang mendapat tindakan positif / rekomendasi yang ditampilkan x 100%.\n\nTindakan positif: permintaan bergabung (sesi) atau undangan dikirim (partner). Klik profil tidak dihitung.\n\nContoh simulasi: 35 / 100 x 100% = 35%.\nLanjut ke: lima metrik.\n\nSumber: Plan/Day9.MD bagian 3A dan 6.", "to": ["fitur-3-outcome/z-uji-bobot/01-r3_metrik.js"]}, {"path": "fitur-3-outcome/b-hasil-pembentukan/01-p3_formasi.js", "name": "Parameter: hasil pembentukan kelompok", "desc": "Berhasil dikonfirmasi atau gagal, diambil otomatis dari status sesi dan undangan.\n\nLanjut ke: hitungan GFR, dan alasan bila gagal.\n\nSumb const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const feats = D.nodes.filter(n => !n.parent);
const boxes = D.nodes.filter(n => n.parent);
const folderOf = n => n.paths[0].replace(/\*\*$/, "");
const boxOfPath = p => boxes.find(b => p.startsWith(folderOf(b)));
const card = {}; D.files.forEach(f => { card[f.path] = f; f.box = boxOfPath(f.path); f.kind = f.name.split(":")[0].split(" ")[0]; });
const links = {}; boxes.forEach(b => links[b.id] = {out: new Set(), inn: new Set()});
D.files.forEach(f => f.to.forEach(t => { const tb = card[t] && card[t].box; if (tb && f.box && tb.id !== f.box.id) { links[f.box.id].out.add(tb.id); links[tb.id].inn.add(f.box.id); } }));
const byId = id => D.nodes.find(n => n.id === id);
let fitur = feats[0].id, pilih = null;

document.getElementById("judul").textContent = D.project.name;
document.getElementById("ringkas").textContent = D.project.summary;
document.getElementById("sumber").textContent = "Sumber: " + D.source;

function tabs() {
  document.getElementById("tabs").innerHTML = feats.map(f => `<button class="tab" role="tab" aria-selected="${f.id === fitur}" data-f="${f.id}"><b>${esc(f.label)}</b><br><small class="muted">${esc(f.summary)}</small></button>`).join("");
}
function grid() {
  const f = byId(fitur);
  document.getElementById("fiturInfo").textContent = f.details || "";
  const L = pilih ? links[pilih] : null;
  document.getElementById("grid").innerHTML = boxes.filter(b => b.parent === fitur).map(b => {
    let cls = "box" + (b.kind === "config" ? " hasil" : "");
    if (L) cls += b.id === pilih ? " pilih" : L.out.has(b.id) ? " keluar" : L.inn.has(b.id) ? " masuk" : " redup";
    return `<button class="${cls}" data-b="${b.id}"><b>${esc(b.label)}</b><small>${esc(b.summary)}</small></button>`;
  }).join("");
  document.getElementById("alur").innerHTML = D.flows.filter(fl => fl.steps.some(s => s.node.startsWith(folderOf(f)))).map(fl =>
    `<div class="flow"><b>${esc(fl.title)}</b><div class="muted">${esc(fl.description)}</div><ol>${fl.steps.map(s => `<li><a class="lnk" data-c="${esc(s.node)}">${esc(card[s.node].name)}</a>: ${esc(s.note)}</li>`).join("")}</ol></div>`).join("");
}
function chipsFor(set) {
  return set.size ? `<div class="chips">${[...set].map(id => `<button class="chip" data-b="${id}">${esc(byId(id).label)}</button>`).join("")}</div>` : `<div class="muted">tidak ada</div>`;
}
function panel(buka, sorot) {
  const b = byId(pilih), L = links[pilih];
  const isi = D.files.filter(f => f.box && f.box.id === pilih);
  let h = `<h3 style="margin:0 0 6px">${esc(b.label)}</h3><p>${esc(b.summary)}</p><p class="pre muted">${esc(b.details || "")}</p>
    <b>Lanjut ke kotak:</b>${chipsFor(L.out)}<b>Datang dari kotak:</b>${chipsFor(L.inn)}`;
  if (!buka) h += `<button class="btn" data-open="1">Buka pohon keputusan (${isi.length} kartu)</button>`;
  else h += `<h3 style="margin:16px 0 4px">Pohon keputusan</h3>` + isi.map(f => `<div class="card ${f.kind}${f.path === sorot ? " sorot" : ""}" id="c-${esc(f.path)}"><h4>${esc(f.name)}</h4><p class="pre">${esc(f.desc)}</p>${f.to.length ? `<div class="chips">${f.to.map(t => `<button class="chip" data-c="${esc(t)}">${esc(card[t].name)}</button>`).join("")}</div>` : ""}</div>`).join("");
  document.getElementById("panel").innerHTML = h;
  if (sorot) { const el = document.getElementById("c-" + sorot); if (el) el.scrollIntoView({block: "center"}); }
}
function keKartu(path) {
  const f = card[path]; if (!f || !f.box) return;
  fitur = f.box.parent; pilih = f.box.id; tabs(); grid(); panel(true, path);
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-f],[data-b],[data-c],[data-open]"); if (!t) return;
  if (t.dataset.f) { fitur = t.dataset.f; pilih = null; tabs(); grid(); document.getElementById("panel").innerHTML = '<p class="muted">Klik satu kotak untuk melihat penjelasannya dan kotak mana yang tersambung.</p>'; }
  else if (t.dataset.b) { const b = byId(t.dataset.b); fitur = b.parent; pilih = b.id; tabs(); grid(); panel(false); }
  else if (t.dataset.c) keKartu(t.dataset.c);
  else if (t.dataset.open) panel(true);
});
document.addEventListener("dblclick", e => { const t = e.target.closest("[data-b]"); if (t && t.classList.contains("box")) panel(true); });
document.getElementById("tanya").innerHTML = D.questions.map(q => `<li>${esc(q.question)} ${q.about.map(p => `<a class="lnk" data-c="${esc(p)}">[${esc(card[p].name)}]</a>`).join(" ")}</li>`).join("");
document.getElementById("asumsi").innerHTML = D.assumptions.map(a => `<li>${esc(a)}</li>`).join("");
tabs(); grid();
</script>
